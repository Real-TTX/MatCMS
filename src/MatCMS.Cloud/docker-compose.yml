services:
  web:
    build:
      # Repo root, because the build needs src/MatCMS.Shared as well. "docker compose up"
      # still works from THIS folder — the context is resolved relative to this file.
      context: ../..
      dockerfile: src/MatCMS.Cloud/Dockerfile
      # Always repull the base images (sdk/aspnet:10.0) when building -> "Always Repull".
      pull: true
    image: matcms-cloud:latest
    container_name: matcms-cloud
    ports:
      # host 9100 -> container 8080 (ASP.NET base-image default port)
      - "9100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Docker engine endpoint. Only instances found on THIS daemon count as "local" and can be
      # updated by the cloud; everything else is "remote" (notify only). Comment the socket mount
      # below out to run the cloud without any Docker access at all.
      - MatCmsCloud__Docker__Endpoint=unix:///var/run/docker.sock
    volumes:
      # One volume holds everything the app persists: DB and data-protection keys.
      - matcms-cloud-data:/app/appdata
      # OPT-IN: mounting the engine socket lets the cloud pull + recreate LOCAL instance containers.
      # It is a privilege escalation (socket access == root on the host) - remove it if you only
      # want update notifications. Read-only is enough to DETECT, but not to UPDATE.
      #
      # No group_add / DOCKER_GID needed: the image's entrypoint reads the socket's group at
      # startup and drops the app to it, so this works out of the box (Docker Desktop and Linux
      # hosts alike). See src/MatCMS.Cloud/docker-entrypoint.sh.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  matcms-cloud-data:

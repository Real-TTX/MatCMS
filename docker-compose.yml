services:
  web:
    build:
      context: .
      # Always repull the base images (sdk/aspnet:10.0) when building -> "Always Repull".
      pull: true
    image: matcms:latest
    container_name: matcms
    ports:
      # host 9101 -> container 8080 (ASP.NET base-image default port)
      - "9101:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      # One volume holds everything the app persists: DB, data-protection keys, scheduled backups, uploads.
      - matcms-data:/app/appdata
    restart: unless-stopped

volumes:
  matcms-data:

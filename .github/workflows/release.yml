name: Release (main)

# main = RELEASE build.
# Version: "MAJOR.MINOR.<run_number>-<utc yyyyMMddHHmmss>"  +  ":latest"
on:
  push:
    branches: [main]
    paths:
      - "src/MatCMS/**"
      # The shared contract is compiled into both images, so a change to it must rebuild this one.
      - "src/MatCMS.Shared/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: matcms

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          MAJOR_MINOR="1.0"
          if [ -f src/MatCMS/VERSION ]; then
            MAJOR_MINOR="$(tr -d ' \t\r\n' < src/MatCMS/VERSION)"
          fi
          [ -n "$MAJOR_MINOR" ] || MAJOR_MINOR="1.0"
          BUILD="${{ github.run_number }}"
          DATETIME="$(date -u +%Y%m%d%H%M%S)"
          VERSION="${MAJOR_MINOR}.${BUILD}-${DATETIME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Lowercase image owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root: the build needs src/MatCMS.Shared next to the project.
          context: .
          file: ./src/MatCMS/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest

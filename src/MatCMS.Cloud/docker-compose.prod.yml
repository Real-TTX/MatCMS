services:
  web:
    image: ghcr.io/real-ttx/matcms-cloud:latest
    pull_policy: always
    ports:
      - 9100:8080
    environment:
      - MatCmsCloud__Docker__Endpoint=unix:///var/run/docker.sock
    volumes:
      - matcms-cloud-data:/app/appdata
      # Mounting the socket is all that is needed. The image's entrypoint detects it and grants
      # the app process access, then runs the app unprivileged — no group_add / DOCKER_GID, no
      # user override. Remove this line to run notify-only (no cloud-side update execution).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - main
    restart: unless-stopped

networks:
  # Shared reverse-proxy network. It is NOT created by this file - a host that does not have it
  # yet fails with "network main declared as external, but could not be found". Create it once:
  #   docker network create main
  main:
    external: true

volumes:
  matcms-cloud-data:

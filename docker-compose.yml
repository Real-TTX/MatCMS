services:
  web:
    build:
      context: .
      # Always repull the base images (sdk/aspnet:10.0) when building -> "Always Repull".
      pull: true
    image: matcms:latest
    container_name: matcms
    ports:
      # host 9101 -> container 8080 (ASP.NET base-image default port)
      - "9101:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - matcms-data:/app/appdata
      - matcms-uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  matcms-data:
  matcms-uploads:
